# CI — the deploy gate (Layer 1).
#
# Every push to main runs lint + the full unit suite (which includes the
# bucket config-load smoke). The VM's ops/deploy.sh refuses to fast-forward
# to a commit whose check-runs are not all green, so a red build here means
# the commit physically never reaches the live bot.
#
# Python 3.11 on purpose: that's the VM's runtime (prod parity), even though
# local dev runs newer.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Minimal test env: parts of the suite exercise code that lazily calls
    # get_settings() (alerts, dashboard app), which locally resolves from the
    # developer's .env. CI provides the same contract with explicit dummies —
    # no secrets, no live endpoints (sqlite DB, Telegram unset -> alerts no-op).
    env:
      TRADING_MODE: testnet
      DATABASE_URL: sqlite:///./ci-test.db
      DELTA_TESTNET_API_KEY: ci-dummy-key
      DELTA_TESTNET_API_SECRET: ci-dummy-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint
        run: ruff check src tests

      - name: Unit tests
        run: pytest tests/unit -q
