# Top-level bucket registry.
#
# Decision 013 — each (trading_type × market) pair gets a fixed INR capital
# pool. Six buckets total; Indian buckets are disabled until Decision 012's
# Dhan adapter lands in Phase 3.
#
# The bucket_state Postgres table is seeded with these values by migration
# 0002; available_balance_inr / locked_margin_inr then mirror the bucket's
# Delta sub-account wallet via the reconciler sweep (Decision 021).

# Decision 019 — each crypto bucket trades on its own Delta India sub-account
# (account_ref → DELTA_<REF>_<MODE>_API_KEY/_SECRET). ``default`` reuses the
# original keys (the account longterm-crypto is already soaking on). New
# sub-accounts are provisioned per phase as each bucket comes online.
# Decision 022 — stop_loss_pct is the broker-side protective stop distance
# (percent of entry price). Values are set to 50% of bucket margin at
# leverage_max (0.5 / leverage), well inside liquidation distance
# (~1/leverage). The stop rests ON the exchange, so it protects even when
# the bot/VM is down.
buckets:
  longterm-crypto:
    capital_inr: 50000
    broker: delta_india
    leverage_max: 5
    enabled: true
    account_ref: default
    stop_loss_pct: 10     # 5x → 50% of margin

  swing-crypto:
    capital_inr: 50000
    broker: delta_india
    leverage_max: 10
    enabled: false   # Phase 2
    account_ref: swing
    stop_loss_pct: 5      # 10x → 50% of margin

  scalp-crypto:
    capital_inr: 50000
    broker: delta_india
    leverage_max: 25
    enabled: false   # Phase 5
    account_ref: scalp
    stop_loss_pct: 2      # 25x → 50% of margin

  gambling-crypto:
    capital_inr: 50000
    broker: delta_india
    leverage_max: 100
    enabled: false   # Phase 6
    account_ref: gamble
    stop_loss_pct: 0.5    # 100x → 50% of margin

  longterm-indian:
    capital_inr: 50000
    broker: dhan
    leverage_max: 1
    enabled: false   # Phase 3 — needs Dhan adapter

  swing-indian:
    capital_inr: 50000
    broker: dhan
    leverage_max: 4
    enabled: true    # Phase 4 — full integration (Dhan sandbox)
    account_ref: dhan
    # Decision 022 (amended for swing-indian): this strategy's edge dies with
    # tight stops, so instead of the 0.5/leverage rule it rests a WIDE
    # catastrophe stop — 20% below entry, far outside the Supertrend/30-day
    # exits, catching only a crash while the bot is down.
    stop_loss_pct: 20
