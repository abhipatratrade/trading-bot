# Top-level bucket registry.
#
# Decision 013 — each (trading_type × market) pair gets a fixed INR capital
# pool. Six buckets total; Indian buckets are disabled until Decision 012's
# Dhan adapter lands in Phase 3.
#
# The bucket_state Postgres table is seeded with these values by migration
# 0002; available_balance_inr / locked_margin_inr then mirror the bucket's
# Delta sub-account wallet via the reconciler sweep (Decision 021).

# Decision 019 — each crypto bucket trades on its own Delta India sub-account
# (account_ref → DELTA_<REF>_<MODE>_API_KEY/_SECRET). ``default`` reuses the
# original keys (the account longterm-crypto is already soaking on). New
# sub-accounts are provisioned per phase as each bucket comes online.
# Decision 022 — stop_loss_pct is the broker-side protective stop distance
# (percent of entry price). Values are set to 50% of bucket margin at
# leverage_max (0.5 / leverage), well inside liquidation distance
# (~1/leverage). The stop rests ON the exchange, so it protects even when
# the bot/VM is down.
buckets:
  longterm-crypto:
    capital_inr: 50000
    broker: delta_india
    leverage_max: 5
    # PAUSED 2026-07-22 (user decision). TRADING_MODE is process-wide, so
    # taking intraday-indian live would have flipped this bucket from its
    # Delta TESTNET soak onto REAL crypto money — while its own Phase 1b gate
    # (allocator.yaml mu/sigma from the backtester) is still unmet. Disabled
    # so "live" means only the bucket that was asked for.
    # To resume: set enabled: true. Note a disabled bucket runs NO exits, so
    # square off anything open before pausing for real money.
    enabled: false
    account_ref: default
    stop_loss_pct: 10     # 5x → 50% of margin

  swing-crypto:
    capital_inr: 50000
    broker: delta_india
    leverage_max: 10
    enabled: false   # Phase 2
    account_ref: swing
    stop_loss_pct: 5      # 10x → 50% of margin

  scalp-crypto:
    capital_inr: 50000
    broker: delta_india
    leverage_max: 25
    enabled: false   # Phase 5
    account_ref: scalp
    stop_loss_pct: 2      # 25x → 50% of margin

  gambling-crypto:
    capital_inr: 50000
    broker: delta_india
    leverage_max: 100
    enabled: false   # Phase 6
    account_ref: gamble
    stop_loss_pct: 0.5    # 100x → 50% of margin

  longterm-indian:
    capital_inr: 50000
    broker: dhan
    leverage_max: 1
    enabled: false   # Phase 3 — needs Dhan adapter

  swing-indian:
    capital_inr: 50000
    broker: dhan
    leverage_max: 4
    # PAUSED 2026-07-22 (user decision) — same reason as longterm-crypto:
    # TRADING_MODE is global, and this bucket's sandbox soak must not become
    # real money as a side effect of taking intraday-indian live.
    # To resume: set enabled: true (and decide sandbox vs live deliberately).
    enabled: false   # was: Phase 4 full integration on Dhan sandbox
    account_ref: dhan
    product: MTF             # funded delivery; CNC fallback when not MTF-eligible
    # Decision 022 (amended for swing-indian): this strategy's edge dies with
    # tight stops, so instead of the 0.5/leverage rule it rests a WIDE
    # catastrophe stop — 20% below entry, far outside the Supertrend/30-day
    # exits, catching only a crash while the bot is down.
    stop_loss_pct: 20

  # Decision 029 — seventh bucket, amending 013's fixed six. NIFTY-100
  # gap-down reversal: long-only intraday fade, entries 09:30–10:30, square-off
  # 15:15. Holdout-validated PF 1.68 / +13.3% on margin.
  intraday-indian:
    # Rs 50,000 (house standard, user decision 2026-07-21). At the 20%
    # per-symbol cap and 5x this gives 5 slots of Rs 50k notional each, vs the
    # Rs 1L notional the backtest was validated at. The cost penalty is small
    # -- the Rs 20 brokerage cap is 0.03%/leg at Rs 50k vs 0.02% at Rs 1L, so
    # round-trip goes 0.10% -> 0.12% against a ~0.62% mean trade. The real
    # cliff is Rs 10k (0.2%/leg), which this stays well clear of.
    capital_inr: 50000
    broker: dhan
    leverage_max: 5          # MIS intraday
    # RE-ARMED 2026-07-23 (2nd arming). Both live bugs from the 1st arming are
    # fixed AND validated live: shared-account scoping (1fe42e1 — reconciler
    # ignores the user's positions) and DH-906 token self-heal (9fd5f87 — no
    # more thrash). Only the validated NIFTY-100 set trades. The ORDER path
    # (INTRADAY placement + 15:15 square-off) is still the one thing unexercised
    # by any test — it goes live on the first qualifying gap-down.
    # OPERATIONAL: do not log into Dhan while the bot runs (single-session token).
    enabled: true
    account_ref: dhan
    # MIS.
    product: INTRADAY
    # Decision 029 AMENDED 2026-07-27 (user decision). Originally an
    # MIS-ineligible scrip failed loudly, because falling back would turn a
    # leveraged same-day trade into a 1x overnight DELIVERY position. The user
    # chose to trade it 1x CNC rather than skip it. Two guards make that safe:
    #   * the retry is ALWAYS sized 1x (runner passes the cash-affordable qty),
    #     so the slot never spends more than its Rs 10k margin budget;
    #   * the 15:15 square-off closes CNC exactly as it closes MIS.
    # Residual risk the user accepted: no broker auto-square-off net on CNC, so
    # a failed square-off leaves an overnight delivery position; and at 1x the
    # notional is Rs 10k, where the Rs 20 brokerage cap is ~0.4% round-trip
    # against a ~0.62% mean trade.
    fallback_product: CNC
    # Entry window differs from swing-indian's 09:45: the earliest reversal
    # candle closes at 09:30 (Decision 029).
    entry_start: "09:30"
    entry_end: "10:30"
    # Same reasoning as Decision 028 — every tight stop tested LOST money
    # (pattern-low RR 1-3, 5m trailing) because the reversal needs hours to
    # play out. This is a crash net for a bot/VM outage only, deliberately far
    # outside the 15:15 square-off's normal range.
    stop_loss_pct: 15
