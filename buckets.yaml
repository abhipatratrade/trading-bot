# Top-level bucket registry.
#
# Decision 013 — each (trading_type × market) pair gets a fixed INR capital
# pool. Six buckets total; Indian buckets are disabled until Decision 012's
# Dhan adapter lands in Phase 3.
#
# The bucket_state Postgres table is seeded with these values by migration
# 0002; available_balance_inr / locked_margin_inr then mirror the bucket's
# Delta sub-account wallet via the reconciler sweep (Decision 021).

# Decision 019 — each crypto bucket trades on its own Delta India sub-account
# (account_ref → DELTA_<REF>_<MODE>_API_KEY/_SECRET). ``default`` reuses the
# original keys (the account longterm-crypto is already soaking on). New
# sub-accounts are provisioned per phase as each bucket comes online.
# Decision 022 — stop_loss_pct is the broker-side protective stop distance
# (percent of entry price). Values are set to 50% of bucket margin at
# leverage_max (0.5 / leverage), well inside liquidation distance
# (~1/leverage). The stop rests ON the exchange, so it protects even when
# the bot/VM is down.
buckets:
  longterm-crypto:
    capital_inr: 50000
    broker: delta_india
    leverage_max: 5
    # PAUSED 2026-07-22 (user decision). TRADING_MODE is process-wide, so
    # taking intraday-indian live would have flipped this bucket from its
    # Delta TESTNET soak onto REAL crypto money — while its own Phase 1b gate
    # (allocator.yaml mu/sigma from the backtester) is still unmet. Disabled
    # so "live" means only the bucket that was asked for.
    # To resume: set enabled: true. Note a disabled bucket runs NO exits, so
    # square off anything open before pausing for real money.
    enabled: false
    account_ref: default
    stop_loss_pct: 10     # 5x → 50% of margin

  swing-crypto:
    capital_inr: 50000
    broker: delta_india
    leverage_max: 10
    enabled: false   # Phase 2
    account_ref: swing
    stop_loss_pct: 5      # 10x → 50% of margin

  scalp-crypto:
    capital_inr: 50000
    broker: delta_india
    leverage_max: 25
    enabled: false   # Phase 5
    account_ref: scalp
    stop_loss_pct: 2      # 25x → 50% of margin

  gambling-crypto:
    capital_inr: 50000
    broker: delta_india
    leverage_max: 100
    enabled: false   # Phase 6
    account_ref: gamble
    stop_loss_pct: 0.5    # 100x → 50% of margin

  longterm-indian:
    capital_inr: 50000
    broker: dhan
    leverage_max: 1
    enabled: false   # Phase 3 — needs Dhan adapter

  # Decision 032 — the bucket's strategy changed. Blasting Momentum (09:45 gap
  # momentum, daily) is inert; swing-indian now runs Midcap-150 1h Mean
  # Reversion, holdout-validated PF 2.31 / +24.7% on margin (train fold).
  swing-indian:
    # Rs 50,000 (house standard). The backtest's unit of risk is a FIXED
    # Rs 10,000 margin/trade, and allocator.yaml's 0.20 per-symbol cap turns
    # this capital into exactly that — so per-trade economics match the
    # validated run and the book is 5 concurrent names instead of the
    # backtest's 20 (user decision 2026-07-27, quarter scale). Raise THIS to
    # scale up; never raise per_symbol_cap, which would change the per-trade
    # size the strategy was validated at.
    capital_inr: 50000
    broker: dhan
    leverage_max: 4
    # LIVE 2026-07-27 (user decision). TRADING_MODE on the VM is already live
    # for intraday-indian, so this bucket trades REAL money from the first
    # qualifying 1h close after deploy. What is exercised: the read path, the
    # Dhan MTF order path (shared with intraday-indian's INTRADAY path), the
    # shared-account scoping (1fe42e1) and the token self-heal (9fd5f87).
    # What is NOT yet exercised live: an MTF entry, a mean-touch exit, and an
    # ATR-distance resting stop. Watch the first fill.
    # OPERATIONAL: do not log into Dhan while the bot runs (single-session token).
    enabled: true
    account_ref: dhan
    product: MTF             # funded delivery; CNC fallback when not MTF-eligible
    fallback_product: CNC    # MTF-ineligible scrip trades 1x rather than skipping
    # Entry window. The 1h signal bins close at 10:15…15:15, and the stub bin
    # (15:15→15:30) is actioned at the NEXT session's 09:15 open — three of the
    # 214 backtest trades entered that way — so the window spans the session.
    # The real gate is bar-driven inside the strategy (a signal is only
    # actionable while its bin is the most recently completed one); this is the
    # coarse guard around it.
    entry_start: "09:15"
    entry_end: "15:30"
    # A 1h strategy under a 1d regime model: without this the runner would pace
    # the bucket at the 1d interval (900s) and act on a 1h close up to fifteen
    # minutes late. The scan itself caches per 1h bin, so a 60s cadence costs
    # nothing extra in Dhan calls.
    tick_interval_seconds: 60
    # Dhan MTF funding cost on the borrowed portion (notional − margin), per
    # calendar day held. The backtest does NOT model it (~4% of net over 24
    # months), so the reconciler subtracts it from realized P&L — Decision 032.
    carry_interest_apr: 0.146
    # Decision 022 (amended for swing-indian): the STRATEGY's own protective
    # stop is 3.5 × daily ATR14 from entry, supplied per position and rested on
    # the exchange by the stop sweep. This percent is the fallback crash net for
    # any position that arrives without a distance (manual import, reconciler
    # adoption) — deliberately wide, and the sweep only ever tightens from it.
    stop_loss_pct: 20
    # Decision 034 — entries carry their protective stop ON the order
    # (Dhan Super Order), so a stop the venue refuses refuses the ENTRY too.
    # Armed 2026-08-18 (user decision). The Decision 022 sweep stays behind
    # it for legacy positions and as the net if the master switch goes off.
    attached_stops: true

  # Decision 029 — seventh bucket, amending 013's fixed six. NIFTY-100
  # gap-down reversal: long-only intraday fade, entries 09:30–10:30, square-off
  # 15:15. Holdout-validated PF 1.68 / +13.3% on margin.
  intraday-indian:
    # Rs 50,000 (house standard, user decision 2026-07-21). At the 20%
    # per-symbol cap and 5x this gives 5 slots of Rs 50k notional each, vs the
    # Rs 1L notional the backtest was validated at. The cost penalty is small
    # -- the Rs 20 brokerage cap is 0.03%/leg at Rs 50k vs 0.02% at Rs 1L, so
    # round-trip goes 0.10% -> 0.12% against a ~0.62% mean trade. The real
    # cliff is Rs 10k (0.2%/leg), which this stays well clear of.
    capital_inr: 50000
    broker: dhan
    leverage_max: 5          # MIS intraday
    # RE-ARMED 2026-07-23 (2nd arming). Both live bugs from the 1st arming are
    # fixed AND validated live: shared-account scoping (1fe42e1 — reconciler
    # ignores the user's positions) and DH-906 token self-heal (9fd5f87 — no
    # more thrash). Only the validated NIFTY-100 set trades. The ORDER path
    # (INTRADAY placement + 15:15 square-off) is still the one thing unexercised
    # by any test — it goes live on the first qualifying gap-down.
    # OPERATIONAL: do not log into Dhan while the bot runs (single-session token).
    enabled: true
    account_ref: dhan
    # MIS.
    product: INTRADAY
    # Decision 029 AMENDED 2026-07-27 (user decision). Originally an
    # MIS-ineligible scrip failed loudly, because falling back would turn a
    # leveraged same-day trade into a 1x overnight DELIVERY position. The user
    # chose to trade it 1x CNC rather than skip it. Two guards make that safe:
    #   * the retry is ALWAYS sized 1x (runner passes the cash-affordable qty),
    #     so the slot never spends more than its Rs 10k margin budget;
    #   * the 15:15 square-off closes CNC exactly as it closes MIS.
    # Residual risk the user accepted: no broker auto-square-off net on CNC, so
    # a failed square-off leaves an overnight delivery position; and at 1x the
    # notional is Rs 10k, where the Rs 20 brokerage cap is ~0.4% round-trip
    # against a ~0.62% mean trade.
    fallback_product: CNC
    # Entry window differs from swing-indian's 09:45: the earliest reversal
    # candle closes at 09:30 (Decision 029).
    entry_start: "09:30"
    entry_end: "10:30"
    # Same reasoning as Decision 028 — every tight stop tested LOST money
    # (pattern-low RR 1-3, 5m trailing) because the reversal needs hours to
    # play out. This is a crash net for a bot/VM outage only, deliberately far
    # outside the 15:15 square-off's normal range.
    stop_loss_pct: 15
    # Decision 034 — entries carry their protective stop ON the order
    # (Dhan Super Order), so a stop the venue refuses refuses the ENTRY too.
    # Armed 2026-08-18 (user decision). The Decision 022 sweep stays behind
    # it for legacy positions and as the net if the master switch goes off.
    attached_stops: true

  # Decision 037 — eighth bucket. MCX commodity futures (NATGASMINI), CCI(20)
  # 225/250 reversion on 15m. A DIFFERENT EXCHANGE from every bucket above:
  # segment MCX_COMM, session 09:00-23:30, CTT instead of STT.
  #
  # SHIPS DISABLED. The port is proven — scripts/cci_gas_parity.py reproduces
  # 125 of 125 backtested trades — but the STRATEGY has not cleared the bar
  # every other bucket here cleared, and its own handoff says why:
  #   * No out-of-sample fold, and structurally none available: TradingView
  #     caps intraday history so 15m gas starts 2025-12-01 and the entire
  #     sample IS the backtest.
  #   * The same configuration is NEGATIVE on 30m and 1H over those months,
  #     and negative in 3 of 4 years on 1H.
  #   * THE EDGE IS THE UNPROTECTED EXPOSURE. 81 of 125 trades are held across
  #     a session close and net +Rs 122,021; the 44 intraday-only trades net
  #     -Rs 25,584. MCX gas is shut 23:30-09:00 and over weekends, and an
  #     exchange-resident stop CANNOT FIRE while it is shut. Four trades gapped
  #     through it in-sample on a series containing +16.0% and -10.8% session
  #     gaps against a 4.5% stop. Adding a square-off removes the edge; keeping
  #     it means accepting gap risk the stop does not cover.
  # Enabling this is a deliberate act with those three facts in hand.
  commodity-indian:
    capital_inr: 500000
    broker: dhan
    exchange: MCX
    # Margin is SPAN, not a leverage multiple. Probed live 2026-08-29:
    # Rs 9,859/lot at Rs 275 = 14.3% of notional, i.e. ~7x. The ceiling is set
    # at 7 so `leverage_max` is not the thing that silently binds; the real
    # sizer is Kelly, and the margin preflight fits every order to the rupee
    # figure Dhan quotes for it.
    leverage_max: 7
    # LIVE on user instruction 2026-08-31, with these facts on the table and
    # unresolved — recorded here because `enabled: true` is the only line in
    # this file that spends real money, and the migration that seeded this
    # bucket shipped it false on purpose:
    #
    #   * No out-of-sample fold, STRUCTURALLY. TradingView caps intraday
    #     history, so the 15m sample starts 2025-12-01 and the whole sample IS
    #     the backtest. The same configuration is NEGATIVE on 30m and 1H over
    #     those same months, and negative in 3 of 4 years on 1H.
    #   * The edge IS the unprotected exposure. 81 of 125 backtested trades are
    #     held across a session close and net +Rs 122,021; the 44 intraday-only
    #     trades net -Rs 25,584. MCX is shut 23:30-09:00 and over weekends, and
    #     the resting stop cannot fire while it is shut. Four trades gapped
    #     through it in-sample.
    #   * The roll is not in the backtest, which traded a spliced continuous
    #     front-month series with no expiry logic and paid no roll spread.
    #   * The MCX ORDER PATH HAS NEVER PLACED A LIVE TRADE. The margin
    #     preflight and the Forever Order probe are proven; entry, exit, the
    #     resting stop on MCX, and the roll executor are not.
    #
    # `max_lots_per_position: 1` below is what makes that acceptable rather
    # than reckless: it caps the implied peak-to-trough drawdown near 4.6% of
    # the bucket instead of ~28%.
    enabled: true
    account_ref: dhan
    # Carry-forward. The strategy holds overnight by design — that is where its
    # edge lives — so this is NOT an intraday product.
    product: MARGIN
    # No fallback. There is no cash equivalent of a futures contract, and a
    # silent retry on a different product would be a different trade.
    fallback_product: null
    # The session is the entry window: this strategy signals on every completed
    # 15m bar, including the 18:00 IST NYMEX open where 28 of 125 trades
    # entered. Narrowing it would remove trades the backtest took.
    entry_start: "09:00"
    entry_end: "23:30"
    # A 15m strategy. 60s keeps the runner acting on a bar close promptly; the
    # scan itself is one pinned symbol, so the cadence costs almost nothing.
    tick_interval_seconds: 60
    # ONE LOT ONLY for the first live run (user decision 2026-08-30).
    #
    # Kelly on this bucket's mu/sigma wants SIX (raw 0.494 -> fractional 0.1235
    # -> Rs 61,744 of margin at Rs 9,859/lot), so this ceiling is the binding
    # constraint and is meant to be. At one lot the in-sample path implies a
    # peak-to-trough drawdown of ~Rs 23,030 (4.6% of the bucket) rather than
    # ~28%, and a single 16% overnight gap costs ~Rs 6,880 (1.4%) rather than
    # ~8%.
    #
    # NOTE the unit: Dhan's order `quantity` for MCX is in LOTS, verified
    # against the margin calculator 2026-08-30 (qty 1 -> Rs 9,859; qty 2 ->
    # Rs 19,719; qty 250 -> Rs 24.6 LAKH on Rs 1.72 crore of notional). One lot
    # is quantity 1. The 250 is the contract SIZE in mmBtu, not the order field.
    max_lots_per_position: 1
    # 4.5% adverse move, the validated distance (RULES.md section 3), rested at
    # the exchange as a reduce-only stop-market. NOT a premium multiple — this
    # is a futures position, so the percent is of the futures price.
    stop_loss_pct: 4.5
    # PROVEN on MCX 2026-09-02: a super order with productType MARGIN on
    # MCX_COMM was accepted (orderId 23326090227875, scripts/mcx_super_probe.py).
    # This said "unproven on MCX" until then — and nobody had ever tested it;
    # the older path was simply assumed safer. It was not.
    #
    # The entry and its stop now go in ONE request, so a stop Dhan refuses means
    # the ENTRY never happens. That matters here more than anywhere else in this
    # repo, because every other stop path on this bucket has now failed in
    # production:
    #
    #   2026-09-01  the position could not be matched to the ledger (Dhan
    #               reports NATGASMINI-25Sep2026-FUT, the bot minted
    #               NATGASMINI-20260925-FUT), so the sweep read it as the
    #               user's and left it alone. Two lots, no stop.
    #   2026-09-02  the sweep was clocked to NSE hours (09:15-15:30) while MCX
    #               trades 09:00-23:30, so for both entries — placed at 23:11
    #               and 23:26 — it never even ran.
    #   2026-09-02  the exit path omitted `product`, so the fallback close went
    #               out MTF and Dhan refused it five times (DH-906).
    #
    # An attached stop depends on none of that: no ledger row, no symbol
    # round-trip, no ownership chain, no session gate. It is the only stop on
    # this bucket that cannot be silently absent.
    attached_stops: true
