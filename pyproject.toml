[project]
name = "trading-bot"
version = "0.1.0"
description = "Multi-strategy crypto + stocks trading bot (Delta India + Zerodha)."
requires-python = ">=3.11"
dependencies = [
    # Config & validation
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",

    # DB
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",

    # Networking
    "httpx>=0.27",
    "websockets>=12.0",

    # Dashboard
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",

    # Brokers / data
    "kiteconnect>=4.2",
    # Delta India: no official Python SDK — we'll write a thin HMAC client.
    # Dhan: no SDK either — thin REST client. pyotp mints the daily TOTP that
    # refreshes Dhan's 24h access token (SEBI cap, 2025-10-01).
    "pyotp>=2.9",

    # Data handling / archive
    "pandas>=2.2",
    "pyarrow>=15.0",

    # Regime detection (Brain)
    "hmmlearn>=0.3",
    "scipy>=1.12",

    # Scheduling & ops
    "APScheduler>=3.10",
    "structlog>=24.1",

    # Telegram alerts
    "python-telegram-bot>=21.0",

    # Google Drive nightly mirror
    "google-api-python-client>=2.120",
    "google-auth>=2.29",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "freezegun>=1.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "ASYNC"]
ignore = ["S101"]  # allow asserts in tests

[tool.ruff.lint.per-file-ignores]
# Test fixtures legitimately assign fake credentials.
"tests/**" = ["S105", "S106"]
# ML convention: X = feature matrix; GaussianHMM = lazily-imported class alias.
"src/shared/regime/hmm_model.py" = ["N806"]
# Pre-existing strategy class name — discovery keys on the `name` attribute,
# not the class name, so renaming is risk without benefit.
"src/strategies/swing/crypto/strategies/ema_9_15.py" = ["N801"]
"tests/unit/test_ema_strategy.py" = ["N801"]
# Asserting the sizer re-raises *whatever* the broker throws is the point.
"tests/unit/test_sizer_contracts.py" = ["B017"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
