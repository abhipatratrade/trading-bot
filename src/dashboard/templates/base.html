<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Trading Bot{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; --accent: #58a6ff; --green: #3fb950; --red: #f85149; --yellow: #d29922; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
        nav { background: var(--card); border-bottom: 1px solid var(--border); padding: 0.75rem 1.5rem; display: flex; gap: 1.5rem; align-items: center; }
        nav a { color: var(--accent); text-decoration: none; font-size: 0.9rem; }
        nav a:hover { text-decoration: underline; }
        nav .brand { font-weight: 600; font-size: 1rem; color: var(--text); margin-right: 1rem; }
        main { max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; }
        h1, h2 { margin-bottom: 1rem; font-weight: 600; }
        h1 { font-size: 1.4rem; }
        h2 { font-size: 1.1rem; margin-top: 2rem; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; }
        th, td { padding: 0.5rem 0.75rem; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
        th { background: var(--card); font-weight: 600; position: sticky; top: 0; }
        tr:hover { background: rgba(88,166,255,0.05); }
        .badge { padding: 0.15rem 0.5rem; border-radius: 3px; font-size: 0.75rem; font-weight: 600; }
        .badge-green { background: rgba(63,185,80,0.15); color: var(--green); }
        .badge-red { background: rgba(248,81,73,0.15); color: var(--red); }
        .badge-yellow { background: rgba(210,153,34,0.15); color: var(--yellow); }
        .badge-blue { background: rgba(88,166,255,0.15); color: var(--accent); }
        .btn { display: inline-block; padding: 0.4rem 0.8rem; border: 1px solid var(--border); border-radius: 4px; background: var(--card); color: var(--text); font-size: 0.8rem; cursor: pointer; text-decoration: none; }
        .btn:hover { border-color: var(--accent); }
        .btn-danger { border-color: var(--red); color: var(--red); }
        .btn-danger:hover { background: rgba(248,81,73,0.15); }
        .btn-success { border-color: var(--green); color: var(--green); }
        .btn-success:hover { background: rgba(63,185,80,0.15); }
        form.inline { display: inline; }
        input[type="text"], select { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 0.35rem 0.6rem; border-radius: 4px; font-size: 0.8rem; }
        .empty { color: #8b949e; font-style: italic; padding: 1rem; }
        .section { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 1rem; margin-bottom: 1.5rem; }
        pre { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0.75rem; font-size: 0.8rem; overflow-x: auto; white-space: pre-wrap; }
    </style>
</head>
<body>
    <nav>
        <span class="brand">Trading Bot</span>
        <a href="/">Positions & Trades</a>
        <a href="/kill-switch">Kill Switch</a>
        <a href="/params">Strategy Params</a>
        <a href="/export/trades.csv" class="btn">Export CSV</a>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
