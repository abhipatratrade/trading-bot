version: 1
backtest_ref: "testnet-phase1-v1-initial"

strategy_id: crypto_longterm
timeframe: 1d
broker: delta_india

# Universe selection
max_positions: 5
volume_rank_source: delta_india       # rank by Delta's 24h turnover_usd
min_24h_volume_usd: 1_000_000        # skip illiquid symbols

# Position sizing
leverage: 5
weight_mode: equal                    # equal-weight across universe

# Rebalance schedule (UTC)
rebalance_hour: 10
rebalance_minute: 0

# Safety thresholds (override global defaults for this strategy)
max_daily_drawdown_pct: 20.0   # relaxed for testnet soak — revert to 5.0 before going live
min_liquidation_distance_pct: 15.0
max_funding_rate: 0.01

# Order execution
order_type: market                    # market orders for daily rebalance
