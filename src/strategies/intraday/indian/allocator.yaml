# Position-size config for intraday-indian (NIFTY-100 Gap-Down Reversal).
#
# backtest_ref: Backtesting Engine/strategies/optimized/nifty100_gap_reversal/
#   results/scanners/nifty100_gap_reversal_opt_opt_full_20260719_030225.json
#
# mu/sigma are per-TRADE (== per-day; every trade opens and squares off inside
# one session, so one "period" is one holding period) over all 76 full-window
# backtest trades:
#   mu_per_period    = mean(trade returns)  = 0.006238
#   sigma_per_period = stdev(trade returns) = 0.018727
# Raw Kelly* = mu/sigma^2 ~ 17.8 — absurd on its face, which is exactly why the
# caps below are what actually bind: fractional 0.25 gives 4.45, and the 20%
# per-symbol cap (5-slot equal weight) clamps it to 0.20. Same shape as
# swing-indian: the cap is the real sizer, Kelly just confirms "size up to it".
#
# The scanner picks a different basket every morning, so per-symbol stats are
# meaningless — every candidate uses default_for_unknown.
#
# SIZE MATTERS HERE MORE THAN USUAL. The edge is thin relative to costs: at
# Rs 10k/trade the backtest showed costs eating ~99% of gross, because the
# Rs 20 brokerage cap is 0.2%/leg at that size. The bucket runs Rs 50,000, so
# 20% x 5x = Rs 50k notional per trade (the backtest used Rs 1L). That costs
# ~0.03%/leg vs 0.02%, i.e. round-trip 0.12% vs 0.10% -- about 3% of the
# ~0.62% mean trade. Acceptable; Rs 10k would not be. Do not cut per_symbol_cap
# and capital together, or the position drifts toward the cliff.

fractional_kelly: 0.25
per_symbol_cap: 0.20      # 5-slot equal-weight basket: 20% of bucket per name
aggregate_cap: 1.00

# Deliberately FLAT (Decision 029). This strategy fades panic gap-downs, which
# cluster in exactly the bear/high-volatility tape a regime gate would shut off
# — the frozen HOLDOUT fold that returned +13.3% CONTAINS the Apr-2025 crash.
# Scaling size down in bear would suppress the strategy when it works best, so
# every regime gets 1.0 and regime.yaml is disabled. Do not "fix" this to the
# 0/0.5/1.0 house default without a fresh backtest showing the gate helps.
regime_multipliers:
  bear: 1.00
  neutral: 1.00
  bull: 1.00

# All scanner candidates use this (daily-rotating universe -> no per-symbol stats).
default_for_unknown:
  mu_per_period: 0.006238    # per trade (one session), from 76 backtest trades
  sigma_per_period: 0.018727 # per trade (one session)

stats: {}

# What the backtest achieved — REPORTING ONLY (Decision 033). The sizer never
# reads this; the EOD report quotes it beside the live figures.
#
# Sources:
#   profit_factor     buckets.yaml Decision 029 comment, "Holdout-validated
#                     PF 1.68 / +13.3% on margin"
#   trades / mean     this file's mu note above — 76 full-window trades,
#                     mu_per_period = mean(trade returns) = 0.006238 (one
#                     period IS one trade here: every trade squares off intraday)
#
# win_rate deliberately BLANK — not recorded in this repo, and the report omits
# what it is not given rather than comparing against a guess.
#
# Read the live-vs-backtest section with THIS bucket's cost profile in mind:
# the edge is thin relative to costs (~0.12% round-trip against a ~0.62% mean
# trade), so execution slippage eats a larger share of it here than anywhere
# else. A slippage figure that looks small in bps can still be a big fraction
# of this strategy's edge.
# ALL FOUR NUMBERS COME FROM THE **HOLDOUT** FOLD — one fold, not a mix.
# scanner.yaml is explicit: "Plan around the holdout grade — NOT the full-period
# +36.6%." An earlier version of this block took profit_factor from the holdout
# but trades/mean from the full run, which flattered the comparison in one
# direction and inflated the sample size in the other.
#
# Recomputed 2026-08-01 directly from the backtest_ref JSON
# (Backtesting Engine/results/scanners/
#  nifty100_gap_reversal_opt_opt_holdout_20260719_030225.json) — note the real
# path has no strategies/optimized/... prefix, unlike the backtest_ref above:
#   trades 35 · PF 1.684 · win 51.43% · mean unlevered pnl/(entry×qty) 0.003803
# The full-period fold, for contrast, is PF 1.99 / win 56.58% / 76 trades — do
# not quietly substitute it because the live figures look bad against holdout.
backtest_baseline:
  profit_factor: 1.684
  win_rate: 0.5143
  mean_trade_return: 0.003803   # per trade (one session), unlevered, net
  trades: 35
  note: >-
    HOLDOUT fold (2024-07→2025-06, includes the Apr-2025 crash). The
    allocator's mu/sigma above are pooled over the FULL 76 trades and are a
    different statistic — sizing input, not a performance baseline.
