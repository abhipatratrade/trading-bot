# intraday-indian regime — DISABLED by design (Decision 029).
#
# Decision 014 gives every bucket a per-bucket HMM, but a regime gate is
# actively wrong for this strategy. It fades panic gap-downs: its signals are
# generated BY bearish tape, and the frozen holdout fold that produced the
# +13.3% / PF 1.68 grade contains the April-2025 crash. Gating (or scaling) on
# a bull/neutral regime would mute the strategy precisely in the conditions it
# was validated in.
#
# With enabled: false, predict_regime returns None, the sizer's per-symbol
# regime multiplier falls back to 1.0, and strategy_master.csv leaves both
# regime columns blank (regime-agnostic under Decision 016's OR semantics).
# allocator.yaml additionally pins all three multipliers to 1.0 as
# belt-and-braces, so no single edit silently re-introduces the gate.
#
# tf is still read by BucketRunner for tick cadence: 5m -> a 60s pipeline pass,
# which is what an intraday bucket needs to catch a reversal candle promptly.
enabled: false
proxy_symbol: NIFTYBEES        # unused while disabled; kept for a future re-enable
tf: 5m
training_window_days: 1100
inference_lookback_bars: 250
retrain_cadence: weekly
symbols: []
