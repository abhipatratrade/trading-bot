# Brain config for longterm-crypto.
# 3-state HMM on BTCUSDT daily bars (Decisions 014, 015).
#
# Enabled 2026-06-13 after the first model train (v20260612_184705) on
# 1100 days of BTCUSDT daily klines. Regime multipliers in allocator.yaml
# are bear=0, neutral=0.5, bull=1.0 — bot will stop opening new positions
# when Brain reports bear.

enabled: true
proxy_symbol: BTCUSD       # Delta India format; brain.py + retrain_job both use Delta
tf: 1d
training_window_days: 1100        # ~3 years of daily bars
inference_lookback_bars: 200      # bars used at predict time
retrain_cadence: weekly           # Mon 02:00 UTC via run_scheduler
