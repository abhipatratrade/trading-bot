# Brain config for longterm-crypto.
#
# Per-(bucket, symbol) HMMs. The retrain job trains:
#   1. A broad-market fallback model on `proxy_symbol` (BTCUSD) stored
#      under the reserved sentinel symbol `_market_`. Used when a coin
#      doesn't have its own model yet.
#   2. One model per entry in `symbols` below, fitted to that coin's own
#      OHLCV. The training tier (3-state-full / 3-state-diag /
#      2-state-diag) is auto-picked from the bar count.
#
# Regime multipliers (allocator.yaml): bear=0, neutral=0.5, bull=1.0.
# A symbol whose Brain says BEAR gets a 0 multiplier on the next tick.

enabled: true
proxy_symbol: BTCUSD             # Delta India format; used for the _market_ model
tf: 1d
training_window_days: 1100        # ~3 years of daily bars (Delta India's history)
inference_lookback_bars: 200      # bars used at predict time
retrain_cadence: weekly           # Mon 02:00 UTC via run_scheduler
fallback_to_market: true          # under-data symbols defer to the _market_ model

# --- Markov 2.0 detection-layer knobs (retrain-time) ---
# Baum-Welch only finds local maxima. Fit several fixed seeds and keep the
# best log-likelihood; 1 reproduces the legacy single-seed fit.
n_restarts: 4
# Verify each fitted model before it ships; on failure the prior model is
# kept (the bucket never ends up with no regime) and a REGIME_MODEL_REJECTED
# audit row + Telegram alert are emitted.
verify_labels: true
min_mean_gap: 0.0005              # min mean-log-return gap between adjacent regimes
min_state_occupancy: 0.03         # each state must cover >= 3% of decoded bars
persistence_diag_stride: 14       # per-bar vs stride-N persistence diagnostic (log/extra only)

# Coins to train per-coin models for. When this list is empty, only the
# `_market_` fallback gets trained — every coin then uses the broad
# market regime (same behaviour as the pre-restructure single-HMM bot).
# Add symbols here matching the scanner's universe.
symbols:
  - BTCUSD
  - ETHUSD
  - SOLUSD
  - XRPUSD
  - BNBUSD
