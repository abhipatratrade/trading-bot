# Position-size config for swing-indian (Midcap-150 1h Mean Reversion).
#
# backtest_ref: Backtesting Engine/strategies/optimized/midcap150_meanrev_1h_swing/
#   results/scanners/nifty_midcap_150_meanrev_1h_midcap_FINAL_fno_5perday_MTFlev_20260724_025002.json
#
# mu/sigma are POOLED per-1D-period stats over all 214 full-window backtest
# trades (573 position-days, 2024-06..2026-07), on UNLEVERED position return
# (pnl / notional, net of costs) -- the same convention the bucket's previous
# occupant used, so the two are comparable:
#   mu_per_period    = sum(trade returns) / sum(days held) = 4.2760 / 573
#                    = 0.007465 / day
#   sigma_per_period = std(trade returns) / sqrt(avg hold) = 0.051661 / sqrt(2.678)
#                    = 0.031572 / day
# Raw Kelly* = mu/sigma^2 ~ 7.49; fractional 0.25 gives 1.87, so as everywhere
# else in this repo the CAP is the real sizer and Kelly just says "size up to
# it". The strategy tf is 1h, but the holding period is days (avg 2.7), so the
# per-period unit here is a DAY -- 1h only sets tick cadence and the dedup
# window.
#
# SIZING, and why per_symbol_cap is 0.20:
#   The backtest's unit of risk is a FIXED Rs 10,000 of own capital per trade,
#   with notional = margin x the stock's own MTF leverage (2.86x-4.55x, avg
#   3.79x => avg notional ~Rs 38k). required_margin = capital x weight, so at
#   capital_inr = Rs 50,000 a 0.20 cap IS exactly Rs 10,000/slot. That also
#   makes the book 5 concurrent positions rather than the backtest's 20-slot
#   / Rs 200k base (user decision 2026-07-27, quarter scale): per-trade
#   economics are identical, the rupee P&L is ~a quarter, and a 6th simultaneous
#   signal is skipped as SKIPPED_INSUFFICIENT rather than sized down.
#   To go to full scale, raise capital_inr in buckets.yaml -- do NOT raise
#   per_symbol_cap, which would inflate the per-trade margin past the validated
#   Rs 10k and change the cost profile.
#
# Leverage: bucket leverage_max=4 is the risk ceiling; BucketRunner._fit_to_margin
# then sizes each order to the leverage Dhan actually grants that scrip
# (required_margin preflight first, scrip-master MTF_LEVERAGE second, 1x if
# neither answers). Do NOT ATR-normalise size -- tested and worse, because
# equalising rupee risk shifts capital off the high-beta names that drive the
# edge, and the drawdown did not even improve.

fractional_kelly: 0.25
per_symbol_cap: 0.20      # 5-slot equal-weight book: Rs 10k margin per name
aggregate_cap: 1.00

# Deliberately FLAT (Decision 032). A market-regime gate was tested and REMOVES
# the edge: gating on "index above SMA" cut net +30.7% -> +2-9%, because the
# crash-rebound trades it filters out ARE the strategy. regime.yaml is disabled
# for this bucket and the strategy_master row leaves both regime columns blank;
# these 1.0s are belt-and-braces so no single edit re-introduces the gate.
regime_multipliers:
  bear: 1.00
  neutral: 1.00
  bull: 1.00

# The scanned set re-ranks every 1h bin, so per-symbol stats are meaningless --
# every candidate uses default_for_unknown.
default_for_unknown:
  mu_per_period: 0.007465    # per 1D bar, pooled from 214 backtest trades
  sigma_per_period: 0.031572 # per 1D bar

stats: {}

# What the backtest achieved — REPORTING ONLY (Decision 033). The sizer never
# reads this; the EOD report quotes it beside the live figures so "swing-indian
# made Rs X" becomes "swing-indian is/isn't earning what was promised".
#
# PF and win_rate are scale-invariant, so these backtest numbers (unlevered
# position return, net of costs) compare directly to live figures in rupees.
# mean_trade_return is NOT — it is the unlevered per-trade return, and the live
# side normalises by notional to match.
#
# Sources, so a wrong number is traceable rather than mysterious:
#   profit_factor     buckets.yaml Decision 032 comment, "holdout-validated
#                     PF 2.31 / +24.7% on margin (train fold)"
#   trades / mean     this file's own mu/sigma note above — 214 full-window
#                     trades, sum(trade returns) = 4.2760 => 4.2760/214
#
# win_rate is deliberately BLANK: it is not recorded anywhere in this repo, and
# a guessed baseline is worse than no baseline (the report omits what it is not
# given). Fill it from the backtest_ref JSON above when you have it to hand.
backtest_baseline:
  profit_factor: 2.31
  mean_trade_return: 0.019981   # 4.2760 / 214, unlevered, net of costs
  trades: 214
  note: >-
    PF from the Decision 032 buckets.yaml comment, whose "(train fold)"
    parenthetical is ambiguous about which fold produced 2.31. Re-read the
    backtest_ref JSON and correct if it disagrees.
