# swing-indian regime — DISABLED by design (Decision 032).
#
# Decision 014 gives every bucket a per-bucket HMM, but a regime gate is
# actively wrong for the strategy this bucket now runs. Midcap-150 1h mean
# reversion buys panic dislocations: its signals are GENERATED by bearish tape,
# and the frozen holdout fold that produced the +57.1% / PF 3.04 grade contains
# the April-2025 crash. The gate was tested explicitly in-sample — filtering on
# "index above SMA" cut net from +30.7% to +2–9% by removing the crash-rebound
# trades that ARE the edge.
#
# With enabled: false, predict_regime returns None, the sizer's per-symbol
# regime multiplier falls back to 1.0, and strategy_master.csv leaves both
# regime columns blank (regime-agnostic under Decision 016's OR semantics).
# allocator.yaml additionally pins all three multipliers to 1.0 as
# belt-and-braces, so no single edit silently re-introduces the gate.
#
# HISTORY: this was `enabled: true` on a NIFTYBEES daily model, because the
# bucket's previous occupant (Blasting Momentum, now inert — see scanner.yaml)
# gated on bull/neutral. Re-enabling that strategy means flipping this back and
# re-arming the indian-regime retrain timer on the VM (Decision 020).
#
# tf is still read as one input to the bucket's tick cadence; swing-indian pins
# it explicitly via tick_interval_seconds in buckets.yaml (a 1h strategy must
# act on a 1h close within a minute, not within the 1d default's 15).
enabled: false
proxy_symbol: NIFTYBEES        # unused while disabled; kept for a future re-enable
tf: 1d
training_window_days: 1100     # ~4.5y of daily bars → 3-state-full tier
inference_lookback_bars: 250
retrain_cadence: weekly
symbols: []                    # broad-market only
